name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    name: Worker (tests + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hexearth-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hexearth-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check

  legacy-python:
    name: Flask app (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q hexmap
